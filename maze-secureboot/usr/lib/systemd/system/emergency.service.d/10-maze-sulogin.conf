# Managed by Maze Linux (maze-secureboot).
#
# Let the emergency shell open without a root password.
#
# WHY THIS IS NEEDED
#
# Maze does not set a root password: the installer creates a wheel/sudo user
# and leaves root without a usable one. That is the right default for daily
# use, but systemd runs `sulogin` for the emergency shell, and sulogin refuses
# an account with no usable password. So the one moment a user genuinely needs
# a shell — a failed mount, a missing device, an unbootable userspace — is
# exactly the moment they are locked out and left with a live USB as the only
# option. For a desktop distribution aimed at people who are not sysadmins,
# that is a dead end.
#
# WHY IT IS SAFE HERE, SPECIFICALLY
#
# The usual objection is that anyone able to reach the emergency shell gets
# root. On Maze that path is closed at a lower layer: the kernel command line
# is sealed inside a MOK-signed UKI, so `systemd.unit=emergency.target` cannot
# be appended at boot — there is no editable bootloader line to append it to,
# and editing the image breaks the signature shim checks. Emergency mode is
# therefore only reachable through a real failure, not through anything an
# attacker can trigger from the boot screen.
#
# And on the default installation the disk is LUKS-encrypted, so getting far
# enough to see this shell already required the passphrase.
#
# On an unencrypted install this does trade a little physical-access hardening
# for recoverability. That is the deliberate choice: a machine its owner cannot
# rescue fails them far more often than one an intruder with a screwdriver
# could have reached anyway.
[Service]
Environment=SULOGIN_FORCE=1
