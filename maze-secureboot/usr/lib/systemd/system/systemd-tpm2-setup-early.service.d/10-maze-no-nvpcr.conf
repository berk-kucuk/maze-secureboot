# maze-secureboot: NvPCRs cannot work on Maze's boot chain — skip, don't fail.
#
# Since systemd 262 an NvPCR (extra PCRs kept in TPM NV memory: hardware,
# cryptsetup, login, verity) can only be set up from a systemd-based initrd,
# using the NvPCR definitions and a signed PCR policy embedded in the UKI
# ('ukify --sign-initrd-pcrs'). Maze boots a classic mkinitcpio initrd (the
# 'encrypt' hook) and its UKIs carry no signed PCR policy, so every NvPCR unit
# fails on every boot of a TPM machine ("Failed to initialize NvPCR index",
# "Could not extend NvPCR") and the system reports itself as degraded.
#
# Nothing in Maze uses NvPCRs: the disk is unlocked by passphrase and nothing is
# sealed to the TPM. The ordinary PCR measurements (systemd-pcrphase*,
# systemd-pcrmachine, systemd-pcrfs*) are untouched and keep running, and the
# SRK/EK are still created by systemd-tpm2-setup.service later in the boot.
#
# Opt back in (only after moving to a systemd initrd with PCR-signed UKIs):
#   sudo mkdir -p /etc/maze && sudo touch /etc/maze/nvpcr.enable
[Unit]
ConditionPathExists=/etc/maze/nvpcr.enable
