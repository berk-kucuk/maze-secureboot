# Managed by Maze Linux. `bootctl update` replaces the removable-path binary
# (EFI/BOOT/BOOTX64.EFI) with an unsigned systemd-boot; re-running the Maze signer
# right after puts shim back there and re-signs the UKI, so systemd-boot stays
# updatable without ever leaving the Secure Boot chain broken.
[Service]
ExecStartPost=-/usr/bin/maze-sb-sign --force-bootloader
